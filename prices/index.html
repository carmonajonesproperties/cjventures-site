<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e8743b">
<title>Snack Prices</title>
<style>
:root{--bg:#fff8f0;--card:#fff;--ink:#3b2f2f;--muted:#8a7a72;--brand:#e8743b;--brand2:#2f9e8f;--line:#f0e2d6;--bad:#c0392b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
h1{font-size:22px;margin:0}
h2{font-size:18px;margin:4px 0 8px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
button.alt{background:var(--brand2)}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:7px 11px;font-size:14px;border-radius:9px}
button:disabled{opacity:.55}
input{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.by{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:44vh;width:100%;transition:opacity .2s}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .box{position:absolute;left:7%;right:7%;top:27%;height:46%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.3)}
.cam .line{position:absolute;left:9%;right:9%;top:50%;height:2px;background:var(--brand);box-shadow:0 0 10px var(--brand);animation:sweep 1.6s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-38px)}50%{transform:translateY(38px)}}
.cam.paused{opacity:.35}.cam.paused .line{display:none}
.cam .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000;font-size:15px}
.camstart{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#status{min-height:1.4em;font-weight:700;margin:8px 0 2px}
#status.ok{color:var(--brand2)}#status.bad{color:var(--bad)}
.tools{display:flex;gap:8px;margin-top:6px}.tools button{flex:1}
.prod{display:flex;gap:12px;align-items:flex-start}
.prod img{width:72px;height:72px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--line);flex-shrink:0}
.prod .name{font-size:18px;font-weight:800;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.money{font-size:26px;font-weight:800;text-align:left;padding:12px 14px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:44px;height:44px;padding:0;font-size:22px}
.qty input{width:80px;text-align:center;font-weight:700}
.hist{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.hrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #f7eee6}
.hrow:last-child{border-bottom:0}
.best{background:#e6f6f2;color:#1f7a6d;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:800;margin-left:6px}
.warn{background:#fff3e0;border:1px solid #f4c98f;border-radius:12px;padding:10px;font-size:14px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:92%;background:#2c2621;color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .3s;pointer-events:none}
#queue{display:none;background:#fff3e0;border:1px solid #f4c98f;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;margin:6px 0}
.list details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:10px 12px}
.list summary{list-style:none;display:flex;gap:10px;align-items:center;cursor:pointer}
.list summary::-webkit-details-marker{display:none}
.list summary img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#fff;flex-shrink:0}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏷️ Snack Prices</h1>
    <div class="row">
      <button id="listBtn" class="ghost sm hidden" onclick="openList()">📋 Price list</button>
      <button id="scanBackBtn" class="ghost sm hidden" onclick="closeList()">📷 Scan</button>
    </div>
  </header>

  <!-- PIN -->
  <div id="pinView" class="card hidden">
    <h2>Owner PIN</h2>
    <p class="by" style="margin-top:0">The same PIN you use for The Turnover Crew. This phone remembers it.</p>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN">
    <button style="width:100%;margin-top:10px" id="pinBtn" onclick="unlock()">Unlock</button>
    <div id="pinMsg" class="by" style="margin-top:8px"></div>
  </div>

  <!-- SCANNER -->
  <div id="scanView" class="hidden">
    <div id="queue"></div>
    <div class="cam" id="cam">
      <video id="video" playsinline muted autoplay></video>
      <div class="box"></div><div class="line"></div>
      <div class="hint" id="hint">Point at a barcode</div>
      <div class="camstart hidden" id="camStart"><button onclick="startCamera()">📷 Turn on camera</button></div>
    </div>
    <div id="status"></div>
    <div class="tools">
      <button class="ghost sm" onclick="typeCode()">⌨️ Type the numbers</button>
      <button class="ghost sm hidden" id="torchBtn" onclick="toggleTorch()">🔦 Light</button>
    </div>

    <div id="panel" class="card hidden">
      <div class="prod">
        <img id="pImg" class="hidden" alt="">
        <div style="flex:1;min-width:0">
          <div class="name" id="pName"></div>
          <div class="by" id="pMeta"></div>
          <button class="ghost sm" id="renameBtn" style="margin-top:6px" onclick="showNameEdit()">✏️ Fix the name</button>
        </div>
      </div>
      <div id="nameEdit" class="hidden">
        <label for="nameIn" id="nameLbl">What is it?</label>
        <input id="nameIn" placeholder="e.g. Lay's Classic chips 1 oz">
        <input id="sizeIn" placeholder="Size (optional), e.g. 12 oz" style="margin-top:6px">
      </div>
      <div id="shopNote" class="by hidden" style="margin-top:8px"></div>
      <div id="hist" class="hist hidden"></div>

      <label for="storeIn">Store</label>
      <input id="storeIn" list="storeList" placeholder="e.g. Costco" autocomplete="off" oninput="markChips()">
      <datalist id="storeList"></datalist>
      <div class="chips" id="chips"></div>

      <label for="priceIn">Total price</label>
      <input id="priceIn" class="money" inputmode="decimal" placeholder="$0.00" autocomplete="off" enterkeyhint="done">

      <label for="countIn">How many in the pack</label>
      <div class="qty">
        <button type="button" class="ghost" onclick="stepCount(-1)">−</button>
        <input id="countIn" inputmode="numeric" value="1" oninput="eachCalc()">
        <button type="button" class="ghost" onclick="stepCount(1)">+</button>
        <span class="by" id="eachOut"></span>
      </div>

      <div class="row" style="margin-top:14px">
        <button class="ghost" style="flex:0 0 auto" onclick="skipItem()">Skip</button>
        <button class="alt" style="flex:1" id="saveBtn" onclick="savePrice()">Save price</button>
      </div>
      <div class="by" id="codeOut" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- PRICE LIST -->
  <div id="listView" class="hidden">
    <input id="listQ" placeholder="Search items or stores" oninput="renderList()">
    <div id="listOut" class="list"><p class="by">Loading…</p></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* The Turnover Crew web app (Deploy > Manage deployments > Web app URL, ending in /exec). */
var API = 'https://script.google.com/macros/s/AKfycbxVaHxcwBTCabSvU-30yq5PnxNIbHtmVZmg-3h4JMZQSw-YROpj5YUj8NMrtf-3Fjoz/exec';

var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function money(n) { return '$' + (Number(n) || 0).toFixed(2); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function toast(m) { var t = $('toast'); t.textContent = m; t.style.opacity = '1'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.opacity = '0'; }, 3200); }
function status(m, cls) { var s = $('status'); s.textContent = m || ''; s.className = cls || ''; }
function show(view) {
  ['pinView', 'scanView', 'listView'].forEach(function (v) { $(v).classList.toggle('hidden', v !== view); });
  $('listBtn').classList.toggle('hidden', view !== 'scanView');
  $('scanBackBtn').classList.toggle('hidden', view !== 'listView');
}

/* ---------- talking to the app (JSONP: a script tag, which works from any website) ---------- */
var PIN = store('cjp_pin') || '', jn = 0;
function api(action, params) {
  return new Promise(function (ok, bad) {
    var name = '__pl' + (++jn) + '_' + Date.now(), s = document.createElement('script');
    var tm = setTimeout(function () { clean(); bad(new Error('No answer from the app. Check your signal.')); }, 25000);
    function clean() { clearTimeout(tm); try { delete window[name]; } catch (e) { window[name] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
    window[name] = function (r) {
      clean();
      if (r && r.ok === false && /wrong pin|too many/i.test(r.error || '')) { PIN = ''; store('cjp_pin', null); }
      if (r && r.ok === false) return bad(new Error(r.error || 'Something went wrong.'));
      ok(r);
    };
    s.onerror = function () { clean(); bad(new Error('Could not reach the app. Check your signal.')); };
    var q = 'pl=' + encodeURIComponent(action) + '&k=' + encodeURIComponent(PIN);
    Object.keys(params || {}).forEach(function (k) { if (params[k] !== undefined && params[k] !== null) q += '&' + k + '=' + encodeURIComponent(params[k]); });
    s.src = API + '?' + q + '&cb=' + name + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}

/* ---------- PIN ---------- */
function unlock() {
  var p = $('pinIn').value.trim(); if (!p) return;
  $('pinBtn').disabled = true; $('pinMsg').textContent = 'Checking…';
  PIN = p;
  api('hello').then(function (r) {
    store('cjp_pin', p); $('pinBtn').disabled = false; $('pinIn').value = '';
    STORES = r.stores || []; startScanner();
  }).catch(function (e) { PIN = ''; $('pinBtn').disabled = false; $('pinMsg').textContent = e.message; });
}
$('pinIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
function needPin(msg) { stopCamera(); show('pinView'); $('pinMsg').textContent = msg || ''; setTimeout(function () { $('pinIn').focus(); }, 200); }

/* ---------- beep ---------- */
var AC = null;
document.addEventListener('pointerdown', function () { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { } }, { passive: true });
function beep() {
  try { if (navigator.vibrate) navigator.vibrate(70); } catch (e) { }
  try { if (!AC) return; var o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 1400; g.gain.value = 0.12; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.09); } catch (e) { }
}

/* ---------- live camera + barcode reader ----------
   Uses the phone's own barcode reader when it has one, otherwise the ZXing-C++ reader (loaded once), otherwise ZXing JS.
   A barcode only counts when its check digit is right, so a blurry misread never gets saved. */
var stream = null, track = null, timer = null, busy = false, scanning = false, det = null, zw = null, zx = null, readersReady = false;
var canvas = document.createElement('canvas'), g2 = canvas.getContext('2d', { willReadFrequently: true });
var lastCode = '', lastT = 0;
function loadScript(u, cb) { var s = document.createElement('script'); s.src = u; s.onload = function () { cb(true); }; s.onerror = function () { cb(false); }; document.head.appendChild(s); }
function prepReaders(cb) {
  if (readersReady) return cb();
  var done = function () { readersReady = true; cb(); };
  if ('BarcodeDetector' in window) {
    try {
      BarcodeDetector.getSupportedFormats().then(function (f) {
        var want = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'].filter(function (x) { return f.indexOf(x) >= 0; });
        if (want.indexOf('ean_13') >= 0) { det = new BarcodeDetector({ formats: want }); return done(); }
        loadWasm(done);
      }, function () { loadWasm(done); });
      return;
    } catch (e) { det = null; }
  }
  loadWasm(done);
}
function loadWasm(cb) {
  hint('Loading the scanner…');
  loadScript('https://cdn.jsdelivr.net/npm/zxing-wasm@3.0.0/dist/iife/reader/index.js', function (ok) {
    if (ok && window.ZXingWASM) { zw = window.ZXingWASM; try { zw.prepareZXingModule({ fireImmediately: true }); } catch (e) { } hint(''); return cb(); }
    loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js', function (ok2) {
      if (ok2 && window.ZXing) zx = window.ZXing;
      if (!zx) status('The barcode reader could not load. Check your signal, or type the numbers.', 'bad');
      hint(''); cb();
    });
  });
}
function hint(m) { $('hint').textContent = m === undefined ? 'Point at a barcode' : m; }
function crop() {
  var v = $('video'), w = v.videoWidth, h = v.videoHeight; if (!w || !h) return null;
  var cw = Math.round(w * 0.9), ch = Math.round(h * 0.55), sx = Math.round((w - cw) / 2), sy = Math.round((h - ch) / 2);
  var k = Math.min(1, 1100 / cw);
  canvas.width = Math.round(cw * k); canvas.height = Math.round(ch * k);
  g2.drawImage(v, sx, sy, cw, ch, 0, 0, canvas.width, canvas.height);
  return canvas;
}
function readOnce(done) {
  var v = $('video');
  if (det) {
    det.detect(v).then(function (r) {
      if (r && r.length) return done(r[0].rawValue);
      var c = crop(); if (!c) return done('');
      det.detect(c).then(function (r2) { done(r2 && r2.length ? r2[0].rawValue : ''); }, function () { done(''); });
    }, function () { done(''); });
    return;
  }
  var c = crop(); if (!c) return done('');
  if (zw) {
    var id = g2.getImageData(0, 0, c.width, c.height);
    zw.readBarcodes(id, { tryHarder: true, tryRotate: true, tryInvert: false, maxNumberOfSymbols: 1 }).then(function (r) {
      var x = (r || []).filter(function (a) { return a && a.text; })[0]; done(x ? x.text : '');
    }, function () { done(''); });
    return;
  }
  if (zx) {
    try {
      var hints = new Map(); hints.set(zx.DecodeHintType.TRY_HARDER, true);
      var rd = new zx.MultiFormatReader(); rd.setHints(hints);
      done(rd.decode(new zx.BinaryBitmap(new zx.HybridBinarizer(new zx.HTMLCanvasElementLuminanceSource(c)))).getText());
    } catch (e) { done(''); }
    return;
  }
  done('');
}
function upcEtoA(e) {
  if (!/^[01]\d{7}$/.test(e)) return '';
  var ns = e[0], d = e.slice(1, 7), ck = e[7], last = d[5], body;
  if (last === '0' || last === '1' || last === '2') body = d.slice(0, 2) + last + '0000' + d.slice(2, 5);
  else if (last === '3') body = d.slice(0, 3) + '00000' + d.slice(3, 5);
  else if (last === '4') body = d.slice(0, 4) + '00000' + d[4];
  else body = d.slice(0, 5) + '0000' + last;
  return ns + body + ck;
}
function checkOk(code) {
  if (!/^\d+$/.test(code)) return null;                 // not a store barcode: confirm by reading it twice instead
  if (!/^(\d{8}|\d{12,14})$/.test(code)) return false;
  var digits = code.split('').map(Number), ck = digits.pop(), sum = 0, w = 3;
  for (var i = digits.length - 1; i >= 0; i--) { sum += digits[i] * w; w = w === 3 ? 1 : 3; }
  if ((10 - (sum % 10)) % 10 === ck) return true;
  if (code.length === 8) { var a = upcEtoA(code); if (a && checkOk(a) === true) return true; }
  return false;
}
function startCamera() {
  $('camStart').classList.add('hidden');
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { status('This browser cannot use the camera. Type the numbers instead.', 'bad'); return; }
  if (stream) { resumeScan(); return; }
  hint('Starting the camera…');
  navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } }).then(function (st) {
    stream = st; track = st.getVideoTracks()[0];
    try {
      var caps = track.getCapabilities ? track.getCapabilities() : {};
      $('torchBtn').classList.toggle('hidden', !caps.torch);
      if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () { });
    } catch (e) { }
    var v = $('video'); v.srcObject = st; return v.play();
  }).then(function () {
    prepReaders(function () { hint(); if ($('panel').classList.contains('hidden')) resumeScan(); });
  }).catch(function (e) {
    hint('');
    $('camStart').classList.remove('hidden');
    var n = e && e.name;
    status(n === 'NotAllowedError' ? 'Camera is blocked for this page. Allow the camera for carmonajones.com in your browser settings, then tap Turn on camera.' :
      'Could not open the camera (' + (n || 'error') + '). Tap Turn on camera, or type the numbers.', 'bad');
  });
}
function stopCamera() {
  scanning = false; if (timer) clearInterval(timer); timer = null;
  if (stream) stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) { } });
  stream = null; track = null; torchOn = false; try { $('video').srcObject = null; } catch (e) { }
}
function resumeScan() {
  if (!stream) return startCamera();
  $('cam').classList.remove('paused'); hint(); scanning = true; lastCode = '';
  if (timer) clearInterval(timer);
  timer = setInterval(function () {
    if (!scanning || busy || !stream || $('video').readyState < 2) return;
    busy = true;
    readOnce(function (code) {
      busy = false;
      code = String(code || '').replace(/\s+/g, '');
      if (!code || !scanning) return;
      var c = checkOk(code), now = Date.now();
      if (c === false) return;                                   // misread: wrong check digit
      if (c === null && !(code === lastCode && now - lastT < 1500)) { lastCode = code; lastT = now; return; } // read twice
      got(code);
    });
  }, det ? 120 : 200);
}
function pauseScan() { scanning = false; if (timer) clearInterval(timer); timer = null; $('cam').classList.add('paused'); hint('Paused'); }
var torchOn = false;
function toggleTorch() { if (!track) return; torchOn = !torchOn; track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () { }); }
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') { stopCamera(); return; }
  if (!$('scanView').classList.contains('hidden') && PIN) { if ($('panel').classList.contains('hidden')) startCamera(); else $('camStart').classList.remove('hidden'); }
});
function typeCode() {
  var v = prompt('Type the numbers under the barcode:'); if (!v) return;
  v = v.replace(/\s+/g, ''); if (!v) return;
  if (checkOk(v) === false && !confirm(v + ' does not look like a whole barcode (the last digit does not match). Use it anyway?')) return;
  got(v);
}

/* ---------- one item: look it up, then price + store ---------- */
var CUR = null, STORES = [];
function got(code) {
  pauseScan(); beep();
  CUR = { code: code, item: null, key: newKey() };
  status('✔ ' + code + ' · looking it up…', 'ok');
  fillPanel(null, true);
  api('look', { bc: code }).then(function (r) {
    if (!CUR || CUR.code !== code) return;
    STORES = r.stores || STORES; CUR.item = r.item;
    status(r.item ? '' : 'Not found online. Type its name once and the app will remember it.', r.item ? '' : 'bad');
    fillPanel(r, false);
  }).catch(function (e) {
    if (!CUR || CUR.code !== code) return;
    if (!PIN) return needPin(e.message);
    status(e.message + ' You can still save the price: it will send when you have signal.', 'bad');
    fillPanel(null, false);
  });
}
function newKey() { var x = ''; while (x.length < 14) x += Math.random().toString(36).slice(2); return 'P' + x.slice(0, 13); }
function fillPanel(r, loading) {
  var it = r && r.item;
  $('panel').classList.remove('hidden');
  $('pName').textContent = loading ? 'Looking it up…' : (it ? it.name : 'Unknown item');
  $('pMeta').textContent = it ? [it.size, it.source ? 'from ' + it.source : ''].filter(Boolean).join(' · ') : '';
  var img = $('pImg'); if (it && it.photo) { img.src = it.photo; img.classList.remove('hidden'); } else { img.removeAttribute('src'); img.classList.add('hidden'); }
  var unknown = !loading && !it;
  $('nameEdit').classList.toggle('hidden', !unknown);
  $('renameBtn').classList.toggle('hidden', loading || unknown);
  $('nameLbl').textContent = 'What is it?';
  $('nameIn').value = it ? it.name : ''; $('sizeIn').value = it ? (it.size || '') : '';
  var sn = $('shopNote');
  if (r && r.shop) { sn.innerHTML = '🛒 In your shop: ' + esc(r.shop.name) + ' · cost ' + money(r.shop.cost) + ' · sells for ' + money(r.shop.retail); sn.classList.remove('hidden'); }
  else sn.classList.add('hidden');
  var h = $('hist'), hs = r && r.history;
  if (hs && hs.byStore && hs.byStore.length) {
    h.innerHTML = '<div class="by" style="font-weight:700;margin-bottom:2px">Prices you have seen</div>' + hs.byStore.map(function (x, i) {
      return '<div class="hrow"><div><b>' + esc(x.store) + '</b>' + (i === 0 && hs.byStore.length > 1 ? '<span class="best">Cheapest</span>' : '') + '<div class="by">' + esc(x.date) + '</div></div>' +
        '<div style="text-align:right"><b>' + money(x.price) + '</b>' + (x.count > 1 ? '<div class="by">' + x.count + ' for ' + money(x.price) + ' · ' + money(x.each) + ' each</div>' : '') + '</div></div>';
    }).join('');
    h.classList.remove('hidden');
  } else h.classList.add('hidden');
  if (r && r.checkOk === false) status('Heads up: that barcode looks misread. Scan it again if the name is wrong.', 'bad');
  var last = store('cjp_store') || '';
  if (!$('storeIn').value) $('storeIn').value = last;
  renderStores();
  $('priceIn').value = ''; $('countIn').value = '1'; eachCalc();
  $('codeOut').textContent = 'Barcode ' + (CUR ? CUR.code : '');
  $('saveBtn').disabled = !!loading;
  if (!loading) setTimeout(function () { (unknown ? $('nameIn') : (!$('storeIn').value ? $('storeIn') : $('priceIn'))).focus(); }, 150);
  $('panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function showNameEdit() { $('nameEdit').classList.remove('hidden'); $('nameLbl').textContent = 'Fix the name'; $('renameBtn').classList.add('hidden'); $('nameIn').focus(); }
function renderStores() {
  var list = STORES.slice(); var last = store('cjp_store'); if (last && list.indexOf(last) < 0) list.unshift(last);
  $('storeList').innerHTML = list.map(function (s) { return '<option value="' + esc(s) + '">'; }).join('');
  $('chips').innerHTML = list.slice(0, 8).map(function (s) { return '<button type="button" class="chip" data-s="' + esc(s) + '">' + esc(s) + '</button>'; }).join('');
  markChips();
}
$('chips').addEventListener('click', function (e) {
  var b = e.target.closest('.chip'); if (!b) return;
  $('storeIn').value = b.getAttribute('data-s'); markChips(); $('priceIn').focus();
});
function markChips() { var v = $('storeIn').value.trim().toLowerCase(); Array.prototype.forEach.call($('chips').children, function (b) { b.classList.toggle('on', b.getAttribute('data-s').toLowerCase() === v); }); }
function stepCount(d) { var n = Math.max(1, (parseInt($('countIn').value, 10) || 1) + d); $('countIn').value = n; eachCalc(); }
function priceVal() { return Math.round((parseFloat(String($('priceIn').value).replace(/[$,\s]/g, '')) || 0) * 100) / 100; }
function eachCalc() { var n = parseInt($('countIn').value, 10) || 1, p = priceVal(); $('eachOut').textContent = n > 1 && p > 0 ? money(p / n) + ' each' : ''; }
$('priceIn').addEventListener('input', eachCalc);
$('priceIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); savePrice(); } });
$('nameIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('storeIn').value ? $('priceIn').focus() : $('storeIn').focus(); } });
$('storeIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('priceIn').focus(); } });
function skipItem() { CUR = null; $('panel').classList.add('hidden'); status(''); resumeScan(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function savePrice() {
  if (!CUR) return;
  var st = $('storeIn').value.trim().replace(/\s+/g, ' '), p = priceVal(), n = Math.max(1, parseInt($('countIn').value, 10) || 1);
  var nameShown = !$('nameEdit').classList.contains('hidden');
  var nm = nameShown ? $('nameIn').value.trim() : (CUR.item ? CUR.item.name : '');
  var sz = nameShown ? $('sizeIn').value.trim() : (CUR.item ? (CUR.item.size || '') : '');
  if (!CUR.item && !nm) { $('nameIn').focus(); return toast('Type what it is first.'); }
  if (!st) { $('storeIn').focus(); return toast('Which store?'); }
  if (!(p > 0)) { $('priceIn').focus(); return toast('Type the price.'); }
  store('cjp_store', st);
  if (STORES.indexOf(st) < 0) STORES.unshift(st);
  var job = { bc: CUR.code, nm: nm, sz: sz, st: st, pr: p.toFixed(2), ct: n, key: CUR.key, label: (nm || CUR.code) + ' at ' + st + ' ' + money(p) };
  queueAdd(job);
  toast('Saving: ' + job.label);
  CUR = null; $('panel').classList.add('hidden'); status('');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  resumeScan();
  sendQueue();
}

/* ---------- saves wait here until they reach the app (a store with no signal loses nothing) ---------- */
function queueGet() { try { return JSON.parse(store('cjp_queue') || '[]'); } catch (e) { return []; } }
function queueSet(q) { store('cjp_queue', JSON.stringify(q)); showQueue(); }
function queueAdd(j) { var q = queueGet(); q.push(j); queueSet(q); }
function showQueue() { var n = queueGet().length, el = $('queue'); el.style.display = n ? 'block' : 'none'; el.textContent = '⏳ ' + n + ' price' + (n === 1 ? '' : 's') + ' waiting to send. They send by themselves when you have signal.'; }
var sending = false;
function sendQueue() {
  if (sending || !PIN) return; var q = queueGet(); if (!q.length) return;
  sending = true; var j = q[0];
  api('save', { bc: j.bc, nm: j.nm, sz: j.sz, st: j.st, pr: j.pr, ct: j.ct, key: j.key }).then(function () {
    sending = false; queueSet(queueGet().filter(function (x) { return x.key !== j.key; }));
    toast('✔ Saved: ' + j.label); sendQueue();
  }).catch(function (e) {
    sending = false;
    if (!PIN) return needPin(e.message);
    if (/store|price|barcode|name/i.test(e.message) && !/signal|answer|reach/i.test(e.message)) { queueSet(queueGet().filter(function (x) { return x.key !== j.key; })); toast('✖ Not saved (' + j.label + '): ' + e.message); sendQueue(); return; }
    showQueue();
  });
}
window.addEventListener('online', sendQueue);
setInterval(sendQueue, 15000);

/* ---------- price list ---------- */
var LIST = [];
function openList() {
  pauseScan(); stopCamera(); show('listView'); $('listOut').innerHTML = '<p class="by">Loading…</p>';
  api('list').then(function (r) { LIST = r.items || []; STORES = r.stores || STORES; renderList(); })
    .catch(function (e) { if (!PIN) return needPin(e.message); $('listOut').innerHTML = '<p class="by">' + esc(e.message) + '</p>'; });
}
function closeList() { show('scanView'); if ($('panel').classList.contains('hidden')) startCamera(); else $('camStart').classList.remove('hidden'); }
function renderList() {
  var q = $('listQ').value.trim().toLowerCase();
  var items = LIST.filter(function (p) { return !q || (p.name + ' ' + p.size + ' ' + p.code + ' ' + p.byStore.map(function (s) { return s.store; }).join(' ')).toLowerCase().indexOf(q) >= 0; });
  if (!items.length) { $('listOut').innerHTML = '<p class="by">' + (LIST.length ? 'Nothing matches.' : 'No prices yet. Scan an item and save its price.') + '</p>'; return; }
  $('listOut').innerHTML = items.map(function (p) {
    var b = p.best || {};
    return '<details><summary>' + (p.photo ? '<img src="' + esc(p.photo) + '" alt="">' : '<span style="font-size:30px">🏷️</span>') +
      '<div style="flex:1;min-width:0"><b>' + esc(p.name) + '</b>' + (p.size ? ' <span class="by">' + esc(p.size) + '</span>' : '') +
      '<div class="by">Cheapest: <b>' + esc(b.store || '') + '</b> ' + money(b.price) + (b.count > 1 ? ' for ' + b.count + ' (' + money(b.each) + ' each)' : '') + '</div></div></summary>' +
      '<div class="hist">' + p.byStore.map(function (x, i) {
        return '<div class="hrow"><div><b>' + esc(x.store) + '</b>' + (i === 0 && p.byStore.length > 1 ? '<span class="best">Cheapest</span>' : '') + '<div class="by">' + esc(x.date) + '</div></div>' +
          '<div style="text-align:right"><b>' + money(x.price) + '</b>' + (x.count > 1 ? '<div class="by">' + money(x.each) + ' each</div>' : '') +
          '<button class="ghost sm" style="margin-top:4px" data-del="' + esc(x.id) + '">✕</button></div></div>';
      }).join('') + '</div>' +
      '<div class="by" style="margin-top:6px">Barcode ' + esc(p.code) + ' · ' + p.n + ' price' + (p.n === 1 ? '' : 's') + ' logged</div></details>';
  }).join('');
}
$('listOut').addEventListener('click', function (e) {
  var b = e.target.closest('[data-del]'); if (!b) return;
  if (!confirm('Remove this price?')) return;
  api('del', { id: b.getAttribute('data-del') }).then(openList).catch(function (er) { toast(er.message); });
});

/* ---------- start ---------- */
function startScanner() { show('scanView'); showQueue(); renderStores(); startCamera(); sendQueue(); }
if (PIN) {
  show('scanView'); showQueue(); startCamera();
  api('hello').then(function (r) { STORES = r.stores || []; renderStores(); sendQueue(); })
    .catch(function (e) { if (!PIN) needPin(e.message); });
} else needPin('');
</script>
</body>
