<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121212">
<title>Snack Prices</title>
<style>
:root{color-scheme:dark;--bg:#121212;--card:#1e1e1e;--field:#262626;--ink:#ececec;--muted:#a9a9a9;--brand:#e8743b;--brand2:#3fb8a6;--line:#6e6e6e;--bad:#ff6b5e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
h1{font-size:22px;margin:0}
h2{font-size:18px;margin:4px 0 8px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
button.alt{background:var(--brand2)}
button.ghost{background:var(--field);color:var(--ink);border:1px solid var(--line)}
button.sm{padding:7px 11px;font-size:14px;border-radius:9px}
button:disabled{opacity:.55}
input{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink)}
input:focus{outline:2px solid var(--brand);border-color:var(--brand)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.by{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:44vh;width:100%;transition:opacity .2s}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .box{position:absolute;left:7%;right:7%;top:27%;height:46%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.3)}
.cam .line{position:absolute;left:9%;right:9%;top:50%;height:2px;background:var(--brand);box-shadow:0 0 10px var(--brand);animation:sweep 1.6s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateY(-38px)}50%{transform:translateY(38px)}}
.cam.paused{opacity:.35}.cam.paused .line{display:none}
.cam .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000;font-size:15px}
.camstart{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#status{min-height:1.4em;font-weight:700;margin:8px 0 2px}
#status.ok{color:var(--brand2)}#status.bad{color:var(--bad)}
.tools{display:flex;gap:8px;margin-top:6px}.tools button{flex:1}
.prod{display:flex;gap:12px;align-items:flex-start}
.prod img{width:72px;height:72px;object-fit:contain;border-radius:10px;background:#2a2a2a;border:1px solid var(--line);flex-shrink:0}
.prod .name{font-size:18px;font-weight:800;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.money{font-size:26px;font-weight:800;text-align:left;padding:12px 14px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:44px;height:44px;padding:0;font-size:22px}
.qty input{width:80px;text-align:center;font-weight:700}
.hist{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.hrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #4d4d4d}
.hrow:last-child{border-bottom:0}
.best{background:#143d36;color:#6fe0cd;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:800;margin-left:6px}
.warn{background:#3a2a14;border:1px solid #c08a3e;border-radius:12px;padding:10px;font-size:14px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:92%;background:#3a3a3a;color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .3s;pointer-events:none}
#queue{display:none;background:#3a2a14;border:1px solid #c08a3e;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;margin:6px 0}
.list details{background:var(--card);border:2px solid var(--line);border-radius:14px;margin:8px 0;padding:10px 12px}
.list summary{list-style:none;display:flex;gap:10px;align-items:center;cursor:pointer}
.list summary::-webkit-details-marker{display:none}
.list summary img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#2a2a2a;flex-shrink:0}
.tog{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin:14px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.tog input{width:22px;height:22px;margin:0;accent-color:var(--bad)}
.salebox{border-left:4px solid #ff6b5e;padding-left:10px;margin-top:4px}
.sale{background:#4a1c1c;color:#ff9c94;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:800;margin-left:6px;white-space:nowrap}
.ended{background:#333;color:#bbb;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;margin-left:6px;white-space:nowrap}
.good{color:var(--brand2);font-weight:700}.badtxt{color:var(--bad);font-weight:700}
.tabs{display:flex;gap:6px;margin:0 0 8px}.tabs button{flex:1}
.editf{background:#1a1a1a;border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0}
.editf label{margin:8px 0 4px}.editf input{padding:9px}
.pbox{background:#13302b;border:1px solid #3fb8a6;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.pbox .big{font-size:20px;font-weight:800}
.pline{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.size{background:#232a4d;color:#aab6ff;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:700;margin-left:6px;white-space:nowrap}
.match{background:#1c2140;border:1px solid #6f7ee0;border-radius:12px;padding:10px 12px;margin-top:10px}
.match .hrow{align-items:center}
.photoprev{outline:3px solid var(--brand2)}
.sech{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:17px;padding:12px 2px 6px;margin-top:4px;border-bottom:2px solid var(--brand)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏷️ Snack Prices</h1>
    <div class="row">
      <button id="listBtn" class="ghost sm hidden" onclick="openList()">📋 Price list</button>
      <button id="scanBackBtn" class="ghost sm hidden" onclick="closeList()">📷 Scan</button>
    </div>
  </header>

  <!-- PIN -->
  <div id="pinView" class="card hidden">
    <h2>Owner PIN</h2>
    <p class="by" style="margin-top:0">The same PIN you use for The Turnover Crew. This phone remembers it.</p>
    <input id="pinIn" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN">
    <button style="width:100%;margin-top:10px" id="pinBtn" onclick="unlock()">Unlock</button>
    <div id="pinMsg" class="by" style="margin-top:8px"></div>
  </div>

  <!-- SCANNER -->
  <div id="scanView" class="hidden">
    <div id="queue"></div>
    <div class="cam" id="cam">
      <video id="video" playsinline muted autoplay></video>
      <div class="box"></div><div class="line"></div>
      <div class="hint" id="hint">Point at a barcode</div>
      <div class="camstart hidden" id="camStart"><button onclick="startCamera()">📷 Turn on camera</button></div>
    </div>
    <div id="status"></div>
    <div class="tools">
      <button class="ghost sm" onclick="typeCode()">⌨️ Type the numbers</button>
      <button class="ghost sm hidden" id="torchBtn" onclick="toggleTorch()">🔦 Light</button>
    </div>

    <div id="panel" class="card hidden">
      <div class="prod">
        <img id="pImg" class="hidden" alt="">
        <div style="flex:1;min-width:0">
          <div class="name" id="pName"></div>
          <div class="by" id="pMeta"></div>
          <button class="ghost sm" id="renameBtn" style="margin-top:6px" onclick="showNameEdit()">✏️ Fix the name</button>
          <button class="ghost sm hidden" id="photoBtn" style="margin-top:6px" onclick="takePhoto()">📷 Add a photo</button>
          <input id="photoIn" type="file" accept="image/*" capture="environment" class="hidden">
        </div>
      </div>
      <div id="nameEdit" class="hidden">
        <label for="nameIn" id="nameLbl">What is it?</label>
        <input id="nameIn" placeholder="e.g. Lay's Classic chips 1 oz">
        <input id="sizeIn" placeholder="Size (optional), e.g. 12 oz" style="margin-top:6px">
      </div>
      <div id="shopNote" class="by hidden" style="margin-top:8px"></div>
      <div id="hist" class="hist hidden"></div>
      <div id="matchBox" class="match hidden"></div>

      <label for="storeIn">Store</label>
      <input id="storeIn" list="storeList" placeholder="e.g. Costco" autocomplete="off" oninput="markChips()">
      <datalist id="storeList"></datalist>
      <div class="chips" id="chips"></div>

      <label for="priceIn">Total price</label>
      <input id="priceIn" class="money cash" inputmode="decimal" placeholder="$0.00" autocomplete="off" enterkeyhint="done">
      <div class="by">No need for the dot: type 499 for $4.99.</div>

      <label for="countIn">How many in the pack</label>
      <div class="qty">
        <button type="button" class="ghost" onclick="stepCount(-1)">−</button>
        <input id="countIn" inputmode="numeric" value="1" oninput="eachCalc()">
        <button type="button" class="ghost" onclick="stepCount(1)">+</button>
        <span class="by" id="eachOut"></span>
      </div>
      <div class="by" id="packHint"></div>

      <label class="tog"><input type="checkbox" id="saleIn" onchange="saleToggle()"> 🏷️ This is a sale price</label>
      <div id="saleBox" class="salebox hidden">
        <label for="regIn">Regular price (optional)</label>
        <input id="regIn" class="cash" inputmode="decimal" placeholder="$0.00" autocomplete="off" oninput="saleCalc()">
        <div class="by" id="regHint"></div>
        <label for="endsIn">Sale ends (optional)</label>
        <input id="endsIn" type="date">
        <div class="chips" id="endChips">
          <button type="button" class="chip" data-d="7">In 1 week</button>
          <button type="button" class="chip" data-d="14">In 2 weeks</button>
          <button type="button" class="chip" data-d="eom">End of month</button>
          <button type="button" class="chip" data-d="">No end date</button>
        </div>
        <div id="saleOut" style="margin-top:8px"></div>
      </div>

      <label for="noteIn">Note (optional)</label>
      <input id="noteIn" placeholder="e.g. Limit 2, member price" autocomplete="off" maxlength="120">
      <div class="chips" id="noteChips">
        <button type="button" class="chip" data-n="Limit 2">Limit 2</button>
        <button type="button" class="chip" data-n="Member price">Member price</button>
        <button type="button" class="chip" data-n="Coupon">Coupon</button>
        <button type="button" class="chip" data-n="Clearance">Clearance</button>
        <button type="button" class="chip" data-n="Online price">Online price</button>
      </div>
      <div id="profitOut" class="pbox hidden"></div>
      <label for="sellIn">Your selling price (optional, tax included)</label>
      <input id="sellIn" class="cash" inputmode="decimal" placeholder="Leave empty to use the suggested price" autocomplete="off">

      <div class="row" style="margin-top:14px">
        <button class="ghost" style="flex:0 0 auto" onclick="skipItem()">Skip</button>
        <button class="alt" style="flex:1" id="saveBtn" onclick="savePrice()">Save price</button>
      </div>
      <div class="by" id="codeOut" style="margin-top:8px"></div>
    </div>
  </div>

  <!-- PRICE LIST -->
  <div id="listView" class="hidden">
    <div class="tabs"><button id="tabAll" class="sm" onclick="listTab('all')">All items</button><button id="tabSale" class="ghost sm" onclick="listTab('sale')">🏷️ On sale now</button></div>
    <input id="listQ" placeholder="Search items or stores" oninput="renderList()">
    <div id="listOut" class="list"><p class="by">Loading…</p></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* The Turnover Crew web app (Deploy > Manage deployments > Web app URL, ending in /exec). */
var API = 'https://script.google.com/macros/s/AKfycbxVaHxcwBTCabSvU-30yq5PnxNIbHtmVZmg-3h4JMZQSw-YROpj5YUj8NMrtf-3Fjoz/exec';

var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function money(n) { return '$' + (Number(n) || 0).toFixed(2); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function toast(m) { var t = $('toast'); t.textContent = m; t.style.opacity = '1'; clearTimeout(t._t); t._t = setTimeout(function () { t.style.opacity = '0'; }, 3200); }
function status(m, cls) { var s = $('status'); s.textContent = m || ''; s.className = cls || ''; }
function show(view) {
  ['pinView', 'scanView', 'listView'].forEach(function (v) { $(v).classList.toggle('hidden', v !== view); });
  $('listBtn').classList.toggle('hidden', view !== 'scanView');
  $('scanBackBtn').classList.toggle('hidden', view !== 'listView');
}

/* ---------- prices type like a cash register: 4, 9, 9 shows $4.99. Type a dot yourself and it keeps exactly what you type. ---------- */
function cashFix(el) {
  var v = String(el.value || '');
  if (!v.trim()) { el._manual = false; return; }
  if (el._manual) return;
  var dots = (v.match(/[.,]/g) || []).length;
  if (dots >= 2 || /[.,]$/.test(v) || (dots === 1 && !el._cash)) {     // you typed a dot (or pasted a price with one): keep it
    if (el._cash && /[.,]$/.test(v)) el.value = String(Number(v.slice(0, -1).replace(/\D/g, '') || '0')) + '.'; // 0.04 then a dot = 4.
    el._manual = true; el._cash = false; return;
  }
  var d = v.replace(/\D/g, '').replace(/^0+/, '').slice(0, 7);
  el._raw = d; el._cash = true;
  el.value = d ? (Number(d) / 100).toFixed(2) : '';
}
document.addEventListener('input', function (e) { if (e.target && e.target.classList && e.target.classList.contains('cash')) cashFix(e.target); }, true);
document.addEventListener('focusin', function (e) {
  var el = e.target; if (!el || !el.classList || !el.classList.contains('cash')) return;
  el._manual = false; el._cash = !!el.value; el._raw = String(el.value || '').replace(/\D/g, '').replace(/^0+/, '');
  setTimeout(function () { try { el.select(); } catch (x) { } }, 0);   // typing replaces a filled-in price
}, true);

/* ---------- talking to the app (JSONP: a script tag, which works from any website) ---------- */
var PIN = store('cjp_pin') || '', jn = 0, OWNER = store('cjp_owner') !== '0';
function api(action, params) {
  return new Promise(function (ok, bad) {
    var name = '__pl' + (++jn) + '_' + Date.now(), s = document.createElement('script');
    var tm = setTimeout(function () { clean(); bad(new Error('No answer from the app. Check your signal.')); }, 25000);
    function clean() { clearTimeout(tm); try { delete window[name]; } catch (e) { window[name] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
    window[name] = function (r) {
      clean();
      if (r && r.ok === false && /wrong pin|too many/i.test(r.error || '')) { PIN = ''; store('cjp_pin', null); }
      if (r && r.ok === false) return bad(new Error(r.error || 'Something went wrong.'));
      ok(r);
    };
    s.onerror = function () { clean(); bad(new Error('Could not reach the app. Check your signal.')); };
    var q = 'pl=' + encodeURIComponent(action) + '&k=' + encodeURIComponent(PIN);
    Object.keys(params || {}).forEach(function (k) { if (params[k] !== undefined && params[k] !== null) q += '&' + k + '=' + encodeURIComponent(params[k]); });
    s.src = API + '?' + q + '&cb=' + name + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}

/* ---------- PIN ---------- */
function unlock() {
  var p = $('pinIn').value.trim(); if (!p) return;
  $('pinBtn').disabled = true; $('pinMsg').textContent = 'Checking…';
  PIN = p;
  api('hello').then(function (r) {
    store('cjp_pin', p); $('pinBtn').disabled = false; $('pinIn').value = '';
    OWNER = r.owner !== false; store('cjp_owner', OWNER ? '1' : '0');
    STORES = r.stores || []; startScanner();
  }).catch(function (e) { PIN = ''; $('pinBtn').disabled = false; $('pinMsg').textContent = e.message; });
}
$('pinIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
function needPin(msg) { stopCamera(); show('pinView'); $('pinMsg').textContent = msg || ''; setTimeout(function () { $('pinIn').focus(); }, 200); }

/* ---------- beep ---------- */
var AC = null;
document.addEventListener('pointerdown', function () { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { } }, { passive: true });
function beep() {
  try { if (navigator.vibrate) navigator.vibrate(70); } catch (e) { }
  try { if (!AC) return; var o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 1400; g.gain.value = 0.12; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.09); } catch (e) { }
}

/* ---------- live camera + barcode reader ----------
   Uses the phone's own barcode reader when it has one, otherwise the ZXing-C++ reader (loaded once), otherwise ZXing JS.
   A barcode only counts when its check digit is right, so a blurry misread never gets saved. */
var stream = null, track = null, timer = null, busy = false, scanning = false, det = null, zw = null, zx = null, readersReady = false;
var canvas = document.createElement('canvas'), g2 = canvas.getContext('2d', { willReadFrequently: true });
var lastCode = '', lastT = 0;
function loadScript(u, cb) { var s = document.createElement('script'); s.src = u; s.onload = function () { cb(true); }; s.onerror = function () { cb(false); }; document.head.appendChild(s); }
function prepReaders(cb) {
  if (readersReady) return cb();
  var done = function () { readersReady = true; cb(); };
  if ('BarcodeDetector' in window) {
    try {
      BarcodeDetector.getSupportedFormats().then(function (f) {
        var want = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'].filter(function (x) { return f.indexOf(x) >= 0; });
        if (want.indexOf('ean_13') >= 0) { det = new BarcodeDetector({ formats: want }); return done(); }
        loadWasm(done);
      }, function () { loadWasm(done); });
      return;
    } catch (e) { det = null; }
  }
  loadWasm(done);
}
function loadWasm(cb) {
  hint('Loading the scanner…');
  loadScript('https://cdn.jsdelivr.net/npm/zxing-wasm@3.0.0/dist/iife/reader/index.js', function (ok) {
    if (ok && window.ZXingWASM) { zw = window.ZXingWASM; try { zw.prepareZXingModule({ fireImmediately: true }); } catch (e) { } hint(''); return cb(); }
    loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js', function (ok2) {
      if (ok2 && window.ZXing) zx = window.ZXing;
      if (!zx) status('The barcode reader could not load. Check your signal, or type the numbers.', 'bad');
      hint(''); cb();
    });
  });
}
function hint(m) { $('hint').textContent = m === undefined ? 'Point at a barcode' : m; }
function crop() {
  var v = $('video'), w = v.videoWidth, h = v.videoHeight; if (!w || !h) return null;
  var cw = Math.round(w * 0.9), ch = Math.round(h * 0.55), sx = Math.round((w - cw) / 2), sy = Math.round((h - ch) / 2);
  var k = Math.min(1, 1100 / cw);
  canvas.width = Math.round(cw * k); canvas.height = Math.round(ch * k);
  g2.drawImage(v, sx, sy, cw, ch, 0, 0, canvas.width, canvas.height);
  return canvas;
}
function readOnce(done) {
  var v = $('video');
  if (det) {
    det.detect(v).then(function (r) {
      if (r && r.length) return done(r[0].rawValue);
      var c = crop(); if (!c) return done('');
      det.detect(c).then(function (r2) { done(r2 && r2.length ? r2[0].rawValue : ''); }, function () { done(''); });
    }, function () { done(''); });
    return;
  }
  var c = crop(); if (!c) return done('');
  if (zw) {
    var id = g2.getImageData(0, 0, c.width, c.height);
    zw.readBarcodes(id, { tryHarder: true, tryRotate: true, tryInvert: false, maxNumberOfSymbols: 1 }).then(function (r) {
      var x = (r || []).filter(function (a) { return a && a.text; })[0]; done(x ? x.text : '');
    }, function () { done(''); });
    return;
  }
  if (zx) {
    try {
      var hints = new Map(); hints.set(zx.DecodeHintType.TRY_HARDER, true);
      var rd = new zx.MultiFormatReader(); rd.setHints(hints);
      done(rd.decode(new zx.BinaryBitmap(new zx.HybridBinarizer(new zx.HTMLCanvasElementLuminanceSource(c)))).getText());
    } catch (e) { done(''); }
    return;
  }
  done('');
}
function upcEtoA(e) {
  if (!/^[01]\d{7}$/.test(e)) return '';
  var ns = e[0], d = e.slice(1, 7), ck = e[7], last = d[5], body;
  if (last === '0' || last === '1' || last === '2') body = d.slice(0, 2) + last + '0000' + d.slice(2, 5);
  else if (last === '3') body = d.slice(0, 3) + '00000' + d.slice(3, 5);
  else if (last === '4') body = d.slice(0, 4) + '00000' + d[4];
  else body = d.slice(0, 5) + '0000' + last;
  return ns + body + ck;
}
function checkOk(code) {

  } else toast('Saving: ' + job.label);
  CUR = null; $('panel').classList.add('hidden'); status('');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  resumeScan();
  sendQueue();
}

/* ---------- saves wait here until they reach the app (a store with no signal loses nothing) ---------- */
function queueGet() { try { return JSON.parse(store('cjp_queue') || '[]'); } catch (e) { return []; } }
function queueSet(q) { store('cjp_queue', JSON.stringify(q)); showQueue(); }
function queueAdd(j) { var q = queueGet(); q.push(j); queueSet(q); }
function showQueue() {
  var q = queueGet(), ph = q.filter(function (x) { return x.type === 'photo'; }).length, n = q.length - ph, el = $('queue');
  el.style.display = q.length ? 'block' : 'none';
  el.textContent = '⏳ ' + [n ? n + ' price' + (n === 1 ? '' : 's') : '', ph ? ph + ' photo' + (ph === 1 ? '' : 's') : ''].filter(Boolean).join(' and ') + ' waiting to send. They send by themselves when you have signal.';
}
var sending = false;
function sendQueue() {
  if (sending || !PIN) return; var q = queueGet(); if (!q.length) return;
  sending = true; var j = q[0];
  if (j.type === 'photo') return sendPhoto(j);
  api('save', { bc: j.bc, nm: j.nm, sz: j.sz, st: j.st, pr: j.pr, ct: j.ct, key: j.key, sl: j.sl, rg: j.rg, en: j.en, nt: j.nt, sp: j.sp }).then(function () {
    sending = false;
    // The price is in. A photo taken with it goes next, as its own step.
    queueSet(queueGet().map(function (x) { return x.key !== j.key ? x : (j.ph ? { type: 'photo', key: j.key, bc: j.bc, ph: j.ph, label: j.nm || j.bc, tries: 0 } : null); }).filter(Boolean));
    toast('✔ Saved: ' + j.label); sendQueue();
  }).catch(function (e) {
    sending = false;
    if (!PIN) return needPin(e.message);
    if (/store|price|barcode|name|sale|date|selling/i.test(e.message) && !/signal|answer|reach/i.test(e.message)) { queueSet(queueGet().filter(function (x) { return x.key !== j.key; })); toast('✖ Not saved (' + j.label + '): ' + e.message); sendQueue(); return; }
    showQueue();
  });
}
/* The photo goes by POST (too big for a link). Another website can't read the answer to a POST, so the page then asks
   the app whether that photo arrived, a few times, before it tries again later. */
function sendPhoto(j) {
  var pk = String(j.key) + 'f', tries = 0;
  var done = function (msg, keep) {
    sending = false;
    var q = queueGet().filter(function (x) { return !(x.type === 'photo' && x.key === j.key); });
    if (keep) q.push(keep);            // try again later, after anything else waiting
    queueSet(q); if (msg) toast(msg); if (!keep) sendQueue();
  };
  var check = function () {
    api('photook', { key: pk }).then(function (r) {
      if (r.photo) return done('✔ Photo saved: ' + j.label);
      if (++tries < 6) return setTimeout(check, 2000);
      j.tries = (j.tries || 0) + 1;
      if (j.tries >= 4) return done('✖ Photo not saved (' + j.label + '). Scan it again to retake it.');
      done('', j);
    }).catch(function (e) { if (!PIN) { sending = false; return needPin(e.message); } j.tries = (j.tries || 0) + 1; done('', j.tries >= 4 ? null : j); });
  };
  try {
    fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ pl: 'photo', k: PIN, bc: j.bc, key: pk, ph: j.ph }) })
      .then(function () { setTimeout(check, 800); }, function () { sending = false; showQueue(); });
  } catch (e) { sending = false; showQueue(); }
}
window.addEventListener('online', sendQueue);
setInterval(sendQueue, 15000);

/* ---------- price list (tap Edit on any price to fix it later) ---------- */
var LIST = [], SALES = [], TAB = 'all', EDIT = '', LINKING = '';
function openList() {
  pauseScan(); stopCamera(); show('listView'); EDIT = ''; $('listOut').innerHTML = '<p class="by">Loading…</p>';
  loadList();
}
function loadList() {
  return api('list').then(function (r) { LIST = r.items || []; SALES = r.sales || []; STORES = r.stores || STORES; renderList(); })
    .catch(function (e) { if (!PIN) return needPin(e.message); $('listOut').innerHTML = '<p class="by">' + esc(e.message) + '</p>'; });
}
function closeList() { show('scanView'); if ($('panel').classList.contains('hidden')) startCamera(); else $('camStart').classList.remove('hidden'); }
function listTab(t) { TAB = t; $('tabAll').className = 'sm' + (t === 'all' ? '' : ' ghost'); $('tabSale').className = 'sm' + (t === 'sale' ? '' : ' ghost'); renderList(); }
function priceRow(x, i, p) {
  var line = '<div class="hrow"><div style="min-width:0"><b>' + esc(x.store) + '</b>' + (x.sizeLabel ? '<span class="size">' + esc(x.sizeLabel) + '</span>' : '') + (i === 0 && p.byStore.length > 1 ? '<span class="best">Cheapest</span>' : '') + saleTag(x) +
    '<div class="by">' + esc(x.date) + (x.by ? ' · ' + esc(x.by) : '') + (x.perUnit ? ' · ' + esc(x.perUnit) : '') + (x.note ? ' · ' + esc(x.note) : '') + '</div>' +
    (x.regular ? '<div class="by">reg. ' + money(x.regular) + ' · save ' + money(x.save) + ' (' + x.pct + '%)</div>' : '') +
    (x.ended && x.regEach ? '<div class="by">Now about ' + money(x.regEach) + ' each at the regular price</div>' : '') + '</div>' +
    '<div style="text-align:right;white-space:nowrap"><b>' + money(x.price) + '</b>' + (x.count > 1 ? '<div class="by">' + x.count + ' · ' + money(x.each) + ' each</div>' : '') +
    '<div style="margin-top:4px"><button class="ghost sm" data-edit="' + esc(x.id) + '">✏️ Edit</button> <button class="ghost sm" data-del="' + esc(x.id) + '">✕</button></div></div></div>';
  return line + (EDIT === x.id ? editForm(x) : '');
}
function editForm(x) {
  return '<div class="editf" id="ef">' +
    '<label>Store</label><input id="efSt" value="' + esc(x.store) + '" list="storeList">' +
    '<label>Total price</label><input id="efPr" class="cash" inputmode="decimal" value="' + esc(Number(x.price).toFixed(2)) + '">' +
    '<label>How many in the pack</label><input id="efCt" inputmode="numeric" value="' + esc(x.count) + '">' +
    '<label class="tog" style="margin-top:10px"><input type="checkbox" id="efSl"' + (x.sale ? ' checked' : '') + ' onchange="$(\'efSale\').classList.toggle(\'hidden\',!this.checked)"> 🏷️ Sale price</label>' +
    '<div id="efSale" class="salebox' + (x.sale ? '' : ' hidden') + '">' +
    '<label>Regular price (optional)</label><input id="efRg" class="cash" inputmode="decimal" value="' + (x.regular ? esc(Number(x.regular).toFixed(2)) : '') + '">' +
    '<label>Sale ends (optional)</label><input id="efEn" type="date" value="' + esc(x.ends || '') + '"></div>' +
    '<label>Note</label><input id="efNt" maxlength="120" value="' + esc(x.note || '') + '">' +
    '<div class="row" style="margin-top:10px"><button class="ghost" style="flex:0 0 auto" data-cancel="1">Cancel</button><button class="alt" style="flex:1" data-save="' + esc(x.id) + '">Save changes</button></div>' +
    '<div class="by" id="efMsg" style="margin-top:6px"></div></div>';
}
/* 🔗 Sizes linked as one product, with Unlink; and "Same product as…" to link this one to another product. */
function linkBlock(p) {
  var h = '';
  if (p.members) h += '<div class="by" style="margin-top:8px"><b>🔗 Grouped as one product:</b></div>' + p.members.map(function (m) {
    return '<div class="hrow"><div>' + esc(m.size || m.name) + (m.pack > 1 ? ' <span class="size">' + m.pack + '-pack</span>' : '') + ' <span class="by">· ' + m.n + ' price' + (m.n === 1 ? '' : 's') + '</span></div>' +
      (OWNER ? '<button class="ghost sm" data-unlink="' + esc(m.code) + '">Unlink</button>' : '') + '</div>';
  }).join('');
  if (!OWNER) return h;
  if (LINKING === p.code) {
    var others = LIST.filter(function (x) { return x.code !== p.code; });
    h += '<div class="match"><b>Same product as which one?</b>' + (others.length ? others.map(function (x) {
      return '<div class="hrow"><div style="min-width:0">' + esc(x.name) + (x.size ? ' <span class="by">' + esc(x.size) + '</span>' : '') + '</div><button class="alt sm" data-dolink="' + esc(p.code) + '|' + esc(x.code) + '">Link</button></div>';
    }).join('') : '<p class="by">No other products yet.</p>') + '<button class="ghost sm" style="margin-top:6px" data-linkcancel="1">Cancel</button></div>';
  } else h += '<button class="ghost sm" style="margin-top:8px" data-linkto="' + esc(p.code) + '">🔗 Same product as…</button>';
  return h;
}
function listPricing(p) {
  var g = p.pricing; if (!g || !g.cost) return '';
  return '<div class="pbox"><div class="by">Cost ' + money(g.cost) + ' each at ' + esc(g.costStore) + (g.rate ? ' · tax included' : '') + '</div>' +
    pmLine('💡 Suggested price', g.suggest, !g.sell) + pmLine('✏️ Your price', g.sell, true) + pmLine('🛒 In your shop now', g.shop) +
    '<button class="ghost sm" style="margin-top:6px" data-sell="' + esc(p.code) + '">✏️ ' + (g.sell ? 'Change my price' : 'Set my price') + '</button></div>';
}
function setSell(code) {
  var p = LIST.filter(function (x) { return x.code === code; })[0], g = p && p.pricing;
  var v = prompt('Your selling price, tax included (leave empty to use the suggested price):', g && g.sell ? g.sell.price.toFixed(2) : (g && g.suggest ? g.suggest.price.toFixed(2) : ''));
  if (v === null) return;
  api('sell', { bc: code, sp: v.trim() }).then(function () { toast('✔ Price saved'); return loadList(); }).catch(function (e) { if (!PIN) return needPin(e.message); toast(e.message); });
}
function saveEdit(id) {
  var p = moneyIn($('efPr').value), n = Math.max(1, parseInt($('efCt').value, 10) || 1), st = $('efSt').value.trim(), sl = $('efSl').checked;
  var rg = sl ? moneyIn($('efRg').value) : 0, en = sl ? $('efEn').value : '';
  if (!st) return ($('efMsg').textContent = 'Which store?');
  if (!(p > 0)) return ($('efMsg').textContent = 'Type the price.');
  if (rg && rg <= p) return ($('efMsg').textContent = 'The regular price should be more than the sale price.');
  $('efMsg').textContent = 'Saving…';
  api('edit', { id: id, st: st, pr: p.toFixed(2), ct: n, sl: sl ? '1' : '0', rg: rg ? rg.toFixed(2) : '', en: en, nt: $('efNt').value.trim() })
    .then(function () { EDIT = ''; toast('✔ Changes saved'); return loadList(); })
    .catch(function (e) { if (!PIN) return needPin(e.message); var m = $('efMsg'); if (m) m.textContent = e.message; });
}
/* 🗂️ Price list sections. Each product goes in a section by words in its name; anything unclear goes in Other. */
var SECTIONS = [['drinks', '🥤 Drinks'], ['snacks', '🍿 Snacks'], ['candy', '🍬 Candy & gum'], ['meals', '🍜 Meals'], ['other', '📦 Other']];
var SEC_RULES = [
  ['candy', /\b(candy|candies|gum|gumballs?|taffy|nerds|airheads?|sour punch|twizzlers?|skittles|starburst|smarties|charleston chew|peppermint patt\w*|york|lollipops?|suckers|pops|tootsie|jolly ranchers?|life ?savers|m&m'?s|snickers|twix|milky way|musketeers|baby ruth|reese'?s|kit ?kat|hershey'?s?|butterfinger|payday|almond joy|mounds|haribo|gumm(y|ies)|swedish fish|sour patch|jelly ?beans?|mentos|tic ?tacs?|altoids|ring pops?|warheads|now ?(and|&|n) ?later|whoppers|milk duds|junior mints|mike ?(and|&|n) ?ike|hot tamales|candy bars?|chocolate bars?|caramels?|licorice|toffee|fudge|truffles?|peeps|lifesavers)\b/],
  ['snacks', /\b(bars?|krispies?|treats?|marshmallows?|cookies?|crackers?|chips|popcorn|jerky|granola|rice cakes?)\b/],
  ['drinks', /\b(drinks?|soda|water|sparkling|seltzer|juice|nectar|lemonade|milk|shakes?|coffee|frappuccino|latte|cold brew|tea|cola|coke|pepsi|dew|dr\.? ?pepper|sprite|fanta|7 ?up|root beer|ginger ale|gatorade|powerade|bodyarmor|monster|red ?bull|rdb|celsius|bang|alani|energy|electrolytes?|hydration|liquid i\.?v\.?|lacroix|la croix|bubly|perrier|kerns?|kern's|capri ?sun|vitamin ?water|kombucha|smoothies?|yoo-?hoo|horchata)\b|pellegrino|caprisun|darigold/],
  ['meals', /\b(noodles?|ramen|chow mein|udon|pho|mac|macaroni|chili|tuna|chicken of the sea|spam|soups?|oatmeal|grits|rice|bibigo|nissin|nongshim|maruchan|pasta|spaghetti|ravioli|chef boyardee|beans|hormel|stew|burritos?|pizzas?|hot pockets?|meals?|entrees?|lunchables)\b/],
  ['snacks', /\b(snacks?|crisps|pretzels?|cheetos|doritos|fritos|takis|cheez\w*|goldfish|oreos?|nutter butter|biscotti|biscuits?|belvita|wafers?|nuts|peanuts|almonds|cashews|pistachios|trail mix|seeds|sticks|landjaeger|pork|beef|slim jim|clif|kind|protein|protien|muffins?|donettes|donuts?|doughnuts?|hostess|little debbie|cakes?|brownies?|pastr(y|ies)|pop-?tarts?|fruit|squeez\w*|applesauce|peaches|pears|mandarins?|pudding|jell-?o|seaweed|crispy|kettle|lays|pringles|sun ?chips|nabisco)\b/],
  ['candy', /chocolate/]
];
function sectionOf(p) {
  var t = String(p.name || '').toLowerCase().replace(/[‘’]/g, "'");
  for (var i = 0; i < SEC_RULES.length; i++) if (SEC_RULES[i][1].test(t)) return SEC_RULES[i][0];
  if (/\bfl\.? ?oz\b|\d\s*ml\b/i.test(String(p.size || ''))) return 'drinks';   // sold by the fluid ounce or ml: a drink
  return 'other';
}
function sectionLabel(k) { for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i][0] === k) return SECTIONS[i][1]; return ''; }
function renderList() {
  var q = $('listQ').value.trim().toLowerCase();
  if (TAB === 'sale') {
    var s = SALES.filter(function (x) { return !q || (x.name + ' ' + x.store).toLowerCase().indexOf(q) >= 0; });
    $('listOut').innerHTML = s.length ? s.map(function (x) {
      return '<div class="card" style="margin:8px 0"><b>' + esc(x.name) + '</b><div class="hrow"><div><b>' + esc(x.store) + '</b>' + saleTag({ sale: true, endsNice: x.endsNice }) +
        (x.regular ? '<div class="by">reg. ' + money(x.regular) + ' · save ' + money(x.save) + ' (' + x.pct + '%)</div>' : '') + '</div>' +
        '<div style="text-align:right"><b>' + money(x.price) + '</b>' + (x.count > 1 ? '<div class="by">' + money(x.each) + ' each</div>' : '') + '</div></div></div>';
    }).join('') : '<p class="by">No sales on right now. Tick "This is a sale price" when you save one and it shows here until the sale ends.</p>';
    return;
  }
  var items = LIST.filter(function (p) { return !q || (p.name + ' ' + p.size + ' ' + p.code + ' ' + sectionLabel(sectionOf(p)) + ' ' + p.byStore.map(function (s) { return s.store; }).join(' ')).toLowerCase().indexOf(q) >= 0; });
  if (!items.length) { $('listOut').innerHTML = '<p class="by">' + (LIST.length ? 'Nothing matches.' : 'No prices yet. Scan an item and save its price.') + '</p>'; return; }
  var card = function (p) {
    var b = p.best || {}, r = p.bestRegular, g = p.pricing, shown = {};
    p.byStore.forEach(function (x) { shown[x.id] = 1; });
    var older = (p.all || []).filter(function (x) { return !shown[x.id]; });
    var editing = (EDIT && (p.all || []).some(function (x) { return x.id === EDIT; })) || LINKING === p.code, editOld = EDIT && older.some(function (x) { return x.id === EDIT; });
    return '<details' + (editing ? ' open' : '') + '><summary>' + (p.photo ? '<img src="' + esc(p.photo) + '" alt="">' : '<span style="font-size:30px">🏷️</span>') +
      '<div style="flex:1;min-width:0"><b>' + esc(p.name) + '</b>' + (p.size ? ' <span class="by">' + esc(p.size) + '</span>' : '') + (p.onSale ? '<span class="sale">SALE</span>' : '') +
      '<div class="by">Cheapest: <b>' + esc(b.store || '') + '</b> ' + money(b.price) + (b.count > 1 ? ' for ' + b.count + ' (' + money(b.each) + ' each)' : '') + (b.perUnit ? ' · ' + esc(b.perUnit) : '') + '</div>' +
      (r && b.sale && !b.ended ? '<div class="by">Best regular price: <b>' + esc(r.store) + '</b> ' + money(r.each) + ' each</div>' : '') +
      (g && (g.sell || g.suggest) ? '<div class="by">💡 Sell for <b>' + money((g.sell || g.suggest).price) + '</b> · ' + (g.sell || g.suggest).margin + '% margin' + (g.sell ? ' (your price)' : '') + '</div>' : '') + '</div></summary>' +
      listPricing(p) +
      '<div class="hist">' + p.byStore.map(function (x, i) { return priceRow(x, i, p); }).join('') + '</div>' +
      (older.length ? '<details style="border:0;padding:0;margin:6px 0 0"' + (editOld ? ' open' : '') + '><summary class="by" style="display:block">Older prices (' + older.length + ')</summary><div class="hist">' +
        older.map(function (x) { return priceRow(x, 1, p); }).join('') + '</div></details>' : '') +
      linkBlock(p) +
      '<div class="by" style="margin-top:6px">Barcode ' + esc(p.code) + ' · ' + p.n + ' price' + (p.n === 1 ? '' : 's') + ' logged</div></details>';
  };
  var bySec = {};
  items.forEach(function (p) { var k = sectionOf(p); (bySec[k] = bySec[k] || []).push(p); });
  $('listOut').innerHTML = SECTIONS.filter(function (s) { return bySec[s[0]]; }).map(function (s) {
    var g = bySec[s[0]];
    return '<div class="sech"><span>' + s[1] + '</span><span class="by">' + g.length + ' item' + (g.length === 1 ? '' : 's') + '</span></div>' + g.map(card).join('');
  }).join('');
}
$('listOut').addEventListener('click', function (e) {
  var ed = e.target.closest('[data-edit]'); if (ed) { e.preventDefault(); EDIT = ed.getAttribute('data-edit'); renderList(); var f = $('ef'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  var lt = e.target.closest('[data-linkto]'); if (lt) { e.preventDefault(); LINKING = lt.getAttribute('data-linkto'); EDIT = ''; renderList(); return; }
  if (e.target.closest('[data-linkcancel]')) { e.preventDefault(); LINKING = ''; renderList(); return; }
  var dl = e.target.closest('[data-dolink]'); if (dl) {
    e.preventDefault(); var pr = dl.getAttribute('data-dolink').split('|'); dl.disabled = true;
    api('link', { bc: pr[0], to: pr[1] }).then(function () { LINKING = ''; toast('✔ Linked as one product'); return loadList(); }).catch(function (er) { if (!PIN) return needPin(er.message); dl.disabled = false; toast(er.message); });
    return;
  }
  var ul = e.target.closest('[data-unlink]'); if (ul) {
    e.preventDefault(); if (!confirm('Keep this barcode as its own product from now on?')) return;
    api('unlink', { bc: ul.getAttribute('data-unlink') }).then(function () { toast('✔ Unlinked'); return loadList(); }).catch(function (er) { if (!PIN) return needPin(er.message); toast(er.message); });
    return;
  }
  var se = e.target.closest('[data-sell]'); if (se) { e.preventDefault(); setSell(se.getAttribute('data-sell')); return; }
  var sv = e.target.closest('[data-save]'); if (sv) { e.preventDefault(); saveEdit(sv.getAttribute('data-save')); return; }
  if (e.target.closest('[data-cancel]')) { e.preventDefault(); EDIT = ''; renderList(); return; }
  var b = e.target.closest('[data-del]'); if (!b) return;
  e.preventDefault();
  if (!confirm('Remove this price?')) return;
  api('del', { id: b.getAttribute('data-del') }).then(loadList).catch(function (er) { toast(er.message); });
});

/* ---------- start ---------- */
function startScanner() { show('scanView'); showQueue(); renderStores(); startCamera(); sendQueue(); }
if (PIN) {
  show('scanView'); showQueue(); startCamera();
  api('hello').then(function (r) { OWNER = r.owner !== false; store('cjp_owner', OWNER ? '1' : '0'); STORES = r.stores || []; renderStores(); sendQueue(); })
    .catch(function (e) { if (!PIN) needPin(e.message); });
} else needPin('');
</script>
