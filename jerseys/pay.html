  .note { font-size: 14px; color: #9fb3cf; margin-top: 16px; }
  .note a { color: #cfe0f5; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #fff; color: #0b1f3a;

    <div class="line" id="noteRow"><span class="k">Note</span><span class="v" id="note"></span><button type="button" id="copyNote">Copy</button></div>
  </div>
  <div class="note">Thanks! – Charles<br><a id="web" href="#">Pay on venmo.com instead</a></div>
</main>
<div id="toast"></div>
