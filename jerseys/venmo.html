<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Pay with Venmo · Jersey Shop</title>
<meta name="theme-color" content="#0b1f3a">
<style>
  html, body { margin: 0; background: #0b1f3a; color: #fff;
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 26px 18px 40px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
  .amt { font-size: 46px; font-weight: 800; margin: 6px 0 2px; }
  .sub { color: #9fb3cf; font-size: 15px; }
  a.go { display: block; text-align: center; margin: 22px 0 8px; padding: 17px; border-radius: 12px;
    background: #3d95ce; color: #fff; font-weight: 800; font-size: 20px; text-decoration: none; }
  .card { background: #fff; color: #0b1f3a; border-radius: 12px; padding: 4px 14px; margin-top: 18px; text-align: left; }
  .line { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid #e3e9f2; }
  .line:last-child { border-bottom: 0; }
  .line .k { font-size: 13px; color: #5b6b82; width: 62px; flex: none; }
  .line .v { flex: 1; font-weight: 700; font-size: 18px; word-break: break-all; }
  button { font: inherit; font-size: 15px; font-weight: 700; border: 0; border-radius: 9px; padding: 8px 12px;
    background: #e8eef7; color: #0b1f3a; }
  .note { font-size: 14px; color: #9fb3cf; margin-top: 16px; }
  .note a { color: #cfe0f5; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #fff; color: #0b1f3a;
    padding: 10px 16px; border-radius: 20px; font-weight: 700; display: none; }
</style>
</head>
<body>
<main>
  <h1>Jersey Shop</h1>
  <div class="amt" id="amt"></div>
  <div class="sub" id="sub"></div>
  <a class="go" id="go" href="#">Pay with Venmo</a>
  <div class="card">
    <div class="line"><span class="k">Pay to</span><span class="v" id="to"></span><button type="button" id="copyTo">Copy</button></div>
    <div class="line"><span class="k">Amount</span><span class="v" id="amt2"></span><button type="button" id="copyAmt">Copy</button></div>
    <div class="line" id="noteRow"><span class="k">Note</span><span class="v" id="note"></span><button type="button" id="copyNote">Copy</button></div>
  </div>
